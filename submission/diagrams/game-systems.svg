<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E4572E"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#fff"/>
  <text x="40" y="58" font-size="30" font-weight="700" fill="#111">Game systems</text>
  <text x="40" y="88" font-size="17" fill="#555">The server decides everything; the Unity client turns server state into spells in the room.</text>

  <!-- server side -->
  <rect x="40" y="120" width="860" height="800" rx="14" fill="#111"/>
  <text x="70" y="162" font-size="21" font-weight="700" fill="#fff">Server · GameState.step() every tick (30 Hz)</text>
  <text x="70" y="190" font-size="15" fill="#aaa">band sign → spell; hand speed from body tracking → throw / swing; hitboxes → damage</text>

  <g font-size="15">
    <!-- fireball row -->
    <rect x="70" y="220" width="150" height="70" rx="8" fill="#E4572E"/>
    <text x="88" y="250" font-weight="700" fill="#fff">SNAP</text><text x="88" y="272" fill="#fff">rising edge</text>
    <rect x="250" y="220" width="190" height="70" rx="8" fill="#fff"/>
    <text x="266" y="250" font-weight="700" fill="#111">Fireball in hand</text><text x="266" y="272" fill="#444">held up to 8 s</text>
    <rect x="470" y="220" width="190" height="70" rx="8" fill="#fff"/>
    <text x="486" y="250" font-weight="700" fill="#111">Throw</text><text x="486" y="272" fill="#444">hand ≥ 2.5 m/s forward</text>
    <rect x="690" y="220" width="180" height="70" rx="8" fill="#fff"/>
    <text x="706" y="250" font-weight="700" fill="#111">Flight + hit</text><text x="706" y="272" fill="#444">20° aim assist, 8 m</text>
    <text x="250" y="316" fill="#ccc">damage grows with throw speed, <tspan fill="#E4572E" font-weight="700">× 0.85–1.15 grip tension</tspan> at release · 0.75 s cooldown</text>

    <!-- sword row -->
    <rect x="70" y="350" width="150" height="70" rx="8" fill="#E4572E"/>
    <text x="88" y="380" font-weight="700" fill="#fff">FIST</text><text x="88" y="402" fill="#fff">held</text>
    <rect x="250" y="350" width="190" height="70" rx="8" fill="#fff"/>
    <text x="266" y="380" font-weight="700" fill="#111">Sword</text><text x="266" y="402" fill="#444">0.9 m blade on hand</text>
    <rect x="470" y="350" width="400" height="70" rx="8" fill="#fff"/>
    <text x="486" y="380" font-weight="700" fill="#111">Swing hit</text><text x="486" y="402" fill="#444">tip speed 2–8 m/s → 6–15 damage</text>
    <text x="250" y="446" fill="#ccc">damage <tspan fill="#E4572E" font-weight="700">× 0.7–1.3 fist tension</tspan> · same target once per 0.5 s</text>

    <!-- shield row -->
    <rect x="70" y="480" width="150" height="70" rx="8" fill="#E4572E"/>
    <text x="88" y="510" font-weight="700" fill="#fff">OPEN PALM</text><text x="88" y="532" fill="#fff">held</text>
    <rect x="250" y="480" width="190" height="70" rx="8" fill="#fff"/>
    <text x="266" y="510" font-weight="700" fill="#111">Shield</text><text x="266" y="532" fill="#444">disc on the palm</text>
    <rect x="470" y="480" width="400" height="70" rx="8" fill="#fff"/>
    <text x="486" y="510" font-weight="700" fill="#111">Block / parry</text><text x="486" y="532" fill="#444">fades over 3.5 s · a shield push locks a sword 1.5 s</text>
    <text x="250" y="576" fill="#ccc">blocks <tspan fill="#E4572E" font-weight="700">50–100% of a hit, set by palm tension</tspan></text>

    <!-- domain row -->
    <rect x="70" y="610" width="150" height="70" rx="8" fill="#fff" stroke="#fff"/>
    <text x="88" y="640" font-weight="700" fill="#111">VOID 2 s</text><text x="88" y="662" fill="#444">band · or hold B</text>
    <rect x="250" y="610" width="190" height="70" rx="8" fill="#fff"/>
    <text x="266" y="640" font-weight="700" fill="#111">Domain expansion</text><text x="266" y="662" fill="#444">Infinite Void</text>
    <rect x="470" y="610" width="400" height="70" rx="8" fill="#fff"/>
    <text x="486" y="640" font-weight="700" fill="#111">Opponents can't cast</text><text x="486" y="662" fill="#444">5 s expansion + 5 s stun</text>

    <g stroke="#888" stroke-width="2">
      <line x1="220" y1="255" x2="248" y2="255" marker-end="url(#a)"/><line x1="440" y1="255" x2="468" y2="255" marker-end="url(#a)"/><line x1="660" y1="255" x2="688" y2="255" marker-end="url(#a)"/>
      <line x1="220" y1="385" x2="248" y2="385" marker-end="url(#a)"/><line x1="440" y1="385" x2="468" y2="385" marker-end="url(#a)"/>
      <line x1="220" y1="515" x2="248" y2="515" marker-end="url(#a)"/><line x1="440" y1="515" x2="468" y2="515" marker-end="url(#a)"/>
      <line x1="220" y1="645" x2="248" y2="645" marker-end="url(#a)"/><line x1="440" y1="645" x2="468" y2="645" marker-end="url(#a)"/>
    </g>

    <line x1="70" y1="720" x2="870" y2="720" stroke="#333"/>
    <text x="70" y="756" font-weight="700" fill="#fff">Rules</text>
    <text x="180" y="756" fill="#ccc">sword and shield only with an empty hand; a held fireball ignores later band readings</text>
    <text x="70" y="790" font-weight="700" fill="#fff">Hitboxes</text>
    <text x="180" y="790" fill="#ccc">head sphere + a capsule per body segment, built from tracked joints: you can dodge</text>
    <text x="70" y="824" font-weight="700" fill="#fff">Match</text>
    <text x="180" y="824" fill="#ccc">150 HP · lobby → ready → countdown → fight → K.O. or time-out (tie → sudden death)</text>
    <text x="70" y="858" font-weight="700" fill="#fff">Solo</text>
    <text x="180" y="858" fill="#ccc">a scripted AI wizard plays through the same inputs as a person</text>
  </g>

  <!-- wire -->
  <line x1="900" y1="400" x2="1006" y2="400" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="912" y="388" font-size="14" fill="#111">server state</text>
  <line x1="1006" y1="470" x2="904" y2="470" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="912" y="460" font-size="14" fill="#111">pose, buttons</text>

  <!-- unity side -->
  <rect x="1010" y="120" width="550" height="800" rx="14" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="1036" y="162" font-size="21" font-weight="700" fill="#111">Unity AR client (Quest 3)</text>
  <text x="1036" y="190" font-size="15" fill="#666">renders server state; runs no mechanics</text>
  <g font-size="15">
    <rect x="1036" y="214" width="498" height="88" rx="8" fill="#f4f4f4"/>
    <text x="1052" y="242" font-weight="700" fill="#111">Networking</text>
    <text x="1052" y="266" fill="#444">ServerDiscovery (UDP) → ServerConnection (TCP)</text>
    <text x="1052" y="288" fill="#444">→ MessageCodec · reconnects keep the player ID</text>

    <rect x="1036" y="316" width="498" height="88" rx="8" fill="#f4f4f4"/>
    <text x="1052" y="344" font-weight="700" fill="#111">Inputs</text>
    <text x="1052" y="368" fill="#444">BodyPoseSampler (full body, 72 Hz) · DomainExpansionButton</text>
    <text x="1052" y="390" fill="#444">PairingButton · ControllerBand (debug stand-in for the band)</text>

    <rect x="1036" y="418" width="498" height="66" rx="8" fill="#f4f4f4"/>
    <text x="1052" y="446" font-weight="700" fill="#111">SharedSpaceAligner</text>
    <text x="1052" y="470" fill="#444">QR floor marker → common room frame for both headsets</text>

    <rect x="1036" y="498" width="498" height="56" rx="8" fill="#111"/>
    <text x="1052" y="532" font-weight="700" fill="#fff">GameClient</text>
    <text x="1160" y="532" fill="#ccc">composition root, dispatches server events</text>

    <line x1="1285" y1="554" x2="1285" y2="580" stroke="#111" stroke-width="2" marker-end="url(#a)"/>

    <rect x="1036" y="584" width="498" height="88" rx="8" fill="#fff" stroke="#E4572E" stroke-width="2"/>
    <text x="1052" y="612" font-weight="700" fill="#111">Spell views</text>
    <text x="1052" y="636" fill="#444">FireballView + FireballVfx · SwordView · ShieldView</text>
    <text x="1052" y="658" fill="#444">InfiniteVoidView · SpellVfx · SpellAudio</text>

    <rect x="1036" y="686" width="498" height="66" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="1052" y="714" font-weight="700" fill="#111">Combat feedback</text>
    <text x="1052" y="738" fill="#444">HealthView · HitCalloutView · player-ID markers</text>

    <rect x="1036" y="766" width="498" height="88" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="1052" y="794" font-weight="700" fill="#111">Match UI (crystal panels, lazy-follow)</text>
    <text x="1052" y="818" fill="#444">MatchMenu · MatchMomentsView · EndGameView</text>
    <text x="1052" y="840" fill="#444">GripCalibrationView · UiTheme (two themes)</text>
  </g>
  <text x="1036" y="890" font-size="14" fill="#888">All visuals are procedural (primitives + particles), passthrough-safe.</text>

  <rect x="40" y="944" width="16" height="16" rx="3" fill="#E4572E"/>
  <text x="66" y="957" font-size="15" fill="#333">driven by the Neural Band (sign or grip tension)</text>
</svg>
