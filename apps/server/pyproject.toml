[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spellgame-server"
version = "0.1.0"
description = "Authoritative game server for the spell-casting game (architecture.md §2.3)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "textual>=8.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["spellgame*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
