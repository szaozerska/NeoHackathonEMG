[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spelltrain"
version = "0.1.0"
description = "Paired EMG and Quest recording, training and spell recognition"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "joblib>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]
neural = ["torch>=2.6,<3"]

[project.scripts]
spelltrain = "spelltrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spelltrain = ["dashboard.html", "dashboard-check.html", "dashboard-advanced.html", "dashboard-supplemental.html", "dashboard-live.html", "dashboard-collect.html", "collection.js", "camera-live.js", "camera-worker.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
